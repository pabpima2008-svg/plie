name: Compilar app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el contenido de la app
        run: npm run validate

      - name: Preparar clave de firma (si existe)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      # 1) APK de PRUEBA: anuncios de prueba de Google y con "Modo prueba" en Ajustes.
      - name: Compilar APK de prueba
        env:
          PLIE_RELEASE: '0'
          PRIVACY_URL: ${{ vars.PRIVACY_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npm run build
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      # 2) AAB para GOOGLE PLAY: anuncios reales (si hay IDs) y sin "Modo prueba".
      - name: Compilar AAB para Google Play
        env:
          PLIE_RELEASE: '1'
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npm run build
          npx cap sync android
          cd android && ./gradlew bundleRelease --no-daemon

      - name: Resumen
        env:
          HAS_KEY: ${{ secrets.KEYSTORE_B64 != '' }}
          HAS_APP: ${{ vars.ADMOB_APP_ID != '' }}
          HAS_BANNER: ${{ vars.ADMOB_BANNER_ID != '' }}
          HAS_INTER: ${{ vars.ADMOB_INTERSTITIAL_ID != '' }}
          HAS_REWARD: ${{ vars.ADMOB_REWARDED_ID != '' }}
        run: |
          {
            echo "## Plié · versión ${{ github.run_number }}"
            echo ""
            if [ "$HAS_KEY" = "true" ]; then echo "- ✅ AAB firmado: listo para subir a Google Play."; else echo "- ⚠️ Falta la clave de firma (secretos KEYSTORE_*): el AAB no sirve para Play."; fi
            if [ "$HAS_APP" = "true" ] && [ "$HAS_BANNER" = "true" ]; then echo "- ✅ Anuncios reales de AdMob en el AAB."; else echo "- ⚠️ Faltan las variables ADMOB_APP_ID y/o ADMOB_BANNER_ID: el AAB lleva anuncios de PRUEBA (no dan dinero)."; fi
            if [ "$HAS_INTER" = "true" ]; then echo "- ✅ Anuncio a pantalla completa (intersticial) activo."; else echo "- ⚠️ Falta ADMOB_INTERSTITIAL_ID: no habrá anuncios a pantalla completa."; fi
            if [ "$HAS_REWARD" = "true" ]; then echo "- ✅ Anuncio con recompensa activo."; else echo "- ⚠️ Falta ADMOB_REWARDED_ID: no habrá anuncios con recompensa."; fi
            echo "- ℹ️ El APK de prueba siempre usa anuncios de prueba."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: plie-apk-de-prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar AAB para Play Store
        uses: actions/upload-artifact@v4
        with:
          name: plie-aab-para-play-store
          path: android/app/build/outputs/bundle/release/app-release.aab
